version: '3.8'

services:
  app-com:
    image: udaypratapcollege:latest
    container_name: udaypratapcollege-com-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - DOMAIN_NAME=udaypratapcollege.com
      - DATABASE_URL=sqlite:./data/college-com.db
    volumes:
      - ./data-com:/app/data
      - ./public/uploads-com:/app/public/uploads
      - ./logs-com:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-com-network

  nginx-com:
    image: nginx:alpine
    container_name: udaypratapcollege-com-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.com.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-com:/etc/nginx/ssl:ro
      - ./logs-com/nginx:/var/log/nginx
    depends_on:
      - app-com
    restart: unless-stopped
    networks:
      - app-com-network

networks:
  app-com-network:
    driver: bridge
