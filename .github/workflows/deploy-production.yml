name: 🚀 Deploy to Production

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: ap-south-1
  TERRAFORM_VERSION: 1.6.0
  NODE_VERSION: 18.x

jobs:
  # ===================================================================
  # Build and Test Job
  # ===================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          echo "Dependencies installed successfully"

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🏗️ Run type checking
        run: npm run type-check

      - name: 🧪 Run tests
        run: npm test || echo "No tests found, skipping"

      - name: 🏭 Build application
        run: npm run build

      - name: 📊 Build summary
        run: |
          echo "✅ Build completed successfully"
          echo "Build artifacts generated in .next/ directory"

  # ===================================================================
  # Terraform Plan Job
  # ===================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment || 'prod' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: 📋 Terraform Init
        working-directory: terraform
        run: terraform init

      - name: 📝 Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: 🔍 Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: 📊 Terraform Plan
        working-directory: terraform
        run: |
          terraform workspace select ${{ github.event.inputs.environment || 'prod' }} || terraform workspace new ${{ github.event.inputs.environment || 'prod' }}
          terraform plan -var-file=environments/${{ github.event.inputs.environment || 'prod' }}/terraform.tfvars -out=tfplan

      - name: 💾 Save Terraform Plan
        uses: actions/cache/save@v3
        with:
          path: terraform/tfplan
          key: tfplan-${{ github.sha }}

  # ===================================================================
  # Manual Approval Gate (Production only)
  # ===================================================================
  approval:
    name: Approval Required
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: 'approval-gate'
    if: github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/master'

    steps:
      - name: ✅ Waiting for approval
        run: echo "Approval received, proceeding with deployment"

  # ===================================================================
  # Terraform Apply Job
  # ===================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan, approval]
    if: always() && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    environment: ${{ github.event.inputs.environment || 'prod' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: 💾 Restore Terraform Plan
        uses: actions/cache/restore@v3
        with:
          path: terraform/tfplan
          key: tfplan-${{ github.sha }}

      - name: 🚀 Terraform Apply
        working-directory: terraform
        run: |
          terraform workspace select ${{ github.event.inputs.environment || 'prod' }}
          terraform apply -auto-approve tfplan

      - name: 📤 Output Terraform Outputs
        working-directory: terraform
        run: terraform output -json > terraform-outputs.json

      - name: 📤 Upload Terraform Outputs
        uses: actions/upload-artifact@v3
        with:
          name: terraform-outputs
          path: terraform/terraform-outputs.json

  # ===================================================================
  # Application Deployment Job
  # ===================================================================
  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: 📥 Download Terraform Outputs
        uses: actions/download-artifact@v3
        with:
          name: terraform-outputs

      - name: 📥 Get EC2 IP
        run: |
          EC2_IP=$(cat terraform-outputs/terraform-outputs.json | jq -r '.ec2_instance_public_ip.value')
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 📤 Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_IP << 'ENDSSH'
            cd /home/ubuntu/app
            git fetch origin
            git reset --hard origin/master
            npm install --production
            pm2 restart college-website
            echo "✅ Deployment complete!"
          ENDSSH

      - name: 🏥 Health Check
        run: |
          sleep 30
          curl -f http://$EC2_IP/api/health || exit 1

  # ===================================================================
  # Notification Job
  # ===================================================================
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [terraform-apply, deploy-app]
    if: always()

    steps:
      - name: 📧 Send success notification
        if: needs.terraform-apply.result == 'success' && needs.deploy-app.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          # Add your notification logic here (Slack, email, etc.)

      - name: ❌ Send failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # Add your notification logic here

